<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频AI自动配音工作流</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .content {
            display: flex;
            min-height: 600px;
        }
        .sidebar {
            width: 300px;
            background: #f9f9f9;
            padding: 30px;
            border-right: 1px solid #e0e0e0;
            overflow-y: auto;
        }
        .main {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .button:hover { transform: translateY(-2px); }
        .button:disabled { opacity: 0.6; }
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            background: #f9f9f9;
        }
        .upload-area:hover { background: #f0f4ff; }
        #videoInput { display: none; }
        .result-section {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }
        .result-card {
            background: white;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }
        .error { background: #fee; color: #c33; padding: 15px; border-radius: 6px; border-left: 4px solid #c33; }
        .success { background: #efe; color: #3c3; padding: 15px; border-radius: 6px; border-left: 4px solid #3c3; }
        .loading { text-align: center; padding: 40px; display: none; }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e0e0e0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .tabs {
            display: flex;
            border-bottom: 2px solid #e0e0e0;
            margin-bottom: 30px;
        }
        .tab-btn {
            flex: 1;
            padding: 15px;
            border: none;
            background: none;
            cursor: pointer;
            font-weight: 500;
            color: #666;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }
        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 视频自动配音效工作流</h1>
            <p>AI分析视频 → 生成音乐/音效提示词</p>
        </div>

        <div class="content">
            <div class="sidebar">
                <h3>⚙️ 配置</h3>
                <div class="form-group">
                    <label for="apiKey">API Key</label>
                    <input type="password" id="apiKey" placeholder="输入 Claude API Key">
                </div>
                <div class="form-group">
                    <label for="baseUrl">Base URL</label>
                    <input type="text" id="baseUrl" placeholder="API 网关地址" value="https://aiapi.uu.cc/v1">
                </div>
                <div style="background: #e3f2fd; padding: 15px; border-radius: 6px; border-left: 4px solid #2196f3; color: #1976d2; font-size: 0.9em;">
                    💡 来自创梦大模型网关的 API 密钥
                </div>
            </div>

            <div class="main">
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('upload')">📤 新建分析</button>
                    <button class="tab-btn" onclick="switchTab('result')">📊 分析结果</button>
                </div>

                <div id="upload" class="tab-content active">
                    <div class="upload-area" onclick="document.getElementById('videoInput').click()">
                        <h3>📹 上传视频</h3>
                        <p>点击上传或拖拽视频到此处</p>
                        <p style="font-size: 0.9em; color: #999;">支持: MP4, MOV, AVI, MKV | 时长: ≤ 5 分钟</p>
                    </div>
                    <input type="file" id="videoInput" accept="video/*" onchange="handleVideoUpload(event)">
                    <div id="loading" class="loading">
                        <div class="spinner"></div>
                        <p>正在分析视频...</p>
                        <p style="color: #999; font-size: 0.9em;">这可能需要 1-3 分钟</p>
                    </div>
                </div>

                <div id="result" class="tab-content">
                    <div id="resultContent"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        function handleVideoUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const apiKey = document.getElementById('apiKey').value;
            if (!apiKey) {
                alert('请先输入 API Key');
                return;
            }

            document.getElementById('loading').style.display = 'block';

            // 读取视频文件为 base64
            const reader = new FileReader();
            reader.onload = async function(e) {
                const videoBase64 = e.target.result.split(',')[1];

                try {
                    // 调用 Claude API
                    const response = await fetch('https://aiapi.uu.cc/v1/messages', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: JSON.stringify({
                            model: 'claude-3-5-sonnet-20241022',
                            max_tokens: 4000,
                            messages: [{
                                role: 'user',
                                content: [
                                    {
                                        type: 'text',
                                        text: `你是一个专业的视频内容分析师。请分析这个视频，并生成 JSON 格式的分析结果。

返回以下结构:
{
  "video_summary": {
    "title": "视频标题",
    "main_theme": "主要主题",
    "overall_emotion": "整体情感",
    "duration": 视频时长秒数
  },
  "music_recommendation": {
    "style": "具体的音乐风格",
    "tempo": "节奏速度",
    "instrumentation": "建议的乐器",
    "mood_descriptors": ["情绪1", "情绪2"],
    "intensity": 7,
    "key_characteristics": "关键特征",
    "ai_prompt": "用于AI生成音乐的英文提示词"
  },
  "timeline": [
    {
      "timestamp": 0,
      "duration_estimate": 5,
      "visual_description": "画面描述",
      "actions": "动作",
      "emotion": "情绪",
      "sfx_needs": ["音效1"],
      "sfx_prompts": {"音效1": "音效描述"}
    }
  ]
}

请仔细分析并返回JSON。`
                                    },
                                    {
                                        type: 'video',
                                        source: {
                                            type: 'base64',
                                            media_type: 'video/mp4',
                                            data: videoBase64
                                        }
                                    }
                                ]
                            }]
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`API 错误: ${response.status}`);
                    }

                    const data = await response.json();
                    const content = data.content[0].text;

                    // 解析 JSON
                    const jsonMatch = content.match(/\{[\s\S]*\}/);
                    if (!jsonMatch) {
                        throw new Error('无法从响应中解析 JSON');
                    }

                    const analysis = JSON.parse(jsonMatch[0]);
                    displayResult(analysis, file.name);

                    document.getElementById('loading').style.display = 'none';
                } catch (err) {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('resultContent').innerHTML = `<div class="error">❌ 分析失败: ${err.message}</div>`;
                    document.querySelector('[onclick="switchTab(\'result\')"]').click();
                }
            };

            reader.readAsDataURL(file);
        }

        function displayResult(analysis, filename) {
            const summary = analysis.video_summary;
            const music = analysis.music_recommendation;
            const timeline = analysis.timeline;

            let html = `
                <div class="result-section">
                    <h3>📺 视频摘要</h3>
                    <div class="result-card">
                        <p><strong>标题:</strong> ${summary.title}</p>
                        <p><strong>主题:</strong> ${summary.main_theme}</p>
                        <p><strong>情感:</strong> ${summary.overall_emotion}</p>
                        <p><strong>时长:</strong> ${summary.duration}秒</p>
                    </div>
                </div>

                <div class="result-section">
                    <h3>🎵 音乐推荐</h3>
                    <div class="result-card">
                        <p><strong>风格:</strong> ${music.style}</p>
                        <p><strong>节奏:</strong> ${music.tempo}</p>
                        <p><strong>强度:</strong> ${music.intensity}/10</p>
                        <p><strong>情绪:</strong> ${music.mood_descriptors.join('、')}</p>
                    </div>
                </div>

                <div class="result-section">
                    <h3>🎼 AI 音乐生成提示词</h3>
                    <div class="result-card">
                        <textarea readonly style="width: 100%; height: 150px;">${music.ai_prompt}</textarea>
                        <button class="button" style="margin-top: 10px;" onclick="copyText(\`${music.ai_prompt}\`)">📋 复制提示词</button>
                    </div>
                </div>

                <div class="result-section">
                    <h3>⏱️ 时间轴分析</h3>
            `;

            timeline.forEach((segment) => {
                html += `
                    <div class="result-card">
                        <p><strong>[${segment.timestamp.toFixed(1)}s] ${segment.visual_description}</strong></p>
                        <p>情绪: ${segment.emotion} | 音效: ${segment.sfx_needs.join('、')}</p>
                        <p><strong>音效提示词:</strong></p>
                `;
                if (segment.sfx_prompts) {
                    for (let sfx in segment.sfx_prompts) {
                        html += `<p><code>${sfx}</code>: ${segment.sfx_prompts[sfx]}</p>`;
                    }
                }
                html += `</div>`;
            });

            html += `</div>`;

            document.getElementById('resultContent').innerHTML = html;
            document.querySelector('[onclick="switchTab(\'result\')"]').click();
        }

        function copyText(text) {
            navigator.clipboard.writeText(text).then(() => alert('✅ 已复制'));
        }
    </script>
</body>
</html>
