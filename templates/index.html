<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频AI自动配音工作流</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            display: flex;
            min-height: 600px;
        }

        .sidebar {
            width: 300px;
            background: #f9f9f9;
            padding: 30px;
            border-right: 1px solid #e0e0e0;
            overflow-y: auto;
        }

        .main {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .sidebar h3 {
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .button:hover {
            transform: translateY(-2px);
        }

        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            background: #f9f9f9;
        }

        .upload-area:hover {
            background: #f0f4ff;
        }

        .upload-area h3 {
            margin-bottom: 10px;
        }

        .upload-area p {
            color: #666;
        }

        #videoInput {
            display: none;
        }

        .result-section {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .result-card {
            background: white;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e0e0e0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            border-left: 4px solid #c33;
        }

        .success {
            background: #efe;
            color: #3c3;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            border-left: 4px solid #3c3;
        }

        .tabs {
            display: flex;
            gap: 0;
            border-bottom: 2px solid #e0e0e0;
            margin-bottom: 30px;
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            border: none;
            background: none;
            cursor: pointer;
            font-weight: 500;
            color: #666;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .history-item {
            background: white;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
            cursor: pointer;
        }

        .history-item:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.9em;
            color: #1976d2;
        }

        code {
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 视频自动配音效工作流</h1>
            <p>AI分析视频 → 生成音乐/音效提示词</p>
        </div>

        <div class="content">
            <!-- 侧边栏 -->
            <div class="sidebar">
                <h3>⚙️ 配置</h3>

                <div class="form-group">
                    <label for="apiKey">API Key</label>
                    <input type="password" id="apiKey" placeholder="输入 Claude API Key">
                </div>

                <div class="form-group">
                    <label for="baseUrl">Base URL</label>
                    <input type="text" id="baseUrl" placeholder="API 网关地址" value="https://aiapi.uu.cc/v1">
                </div>

                <div class="info-box">
                    💡 来自创梦大模型网关的 API 密钥
                </div>

                <h3 style="margin-top: 40px;">📋 分析历史</h3>
                <div id="historyList"></div>
            </div>

            <!-- 主内容 -->
            <div class="main">
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('upload')">📤 新建分析</button>
                    <button class="tab-btn" onclick="switchTab('result')">📊 分析结果</button>
                </div>

                <!-- 上传标签页 -->
                <div id="upload" class="tab-content active">
                    <div class="upload-area" onclick="document.getElementById('videoInput').click()">
                        <h3>📹 上传视频</h3>
                        <p>点击上传或拖拽视频到此处</p>
                        <p style="font-size: 0.9em; color: #999;">支持: MP4, MOV, AVI, MKV | 时长: ≤ 5 分钟</p>
                    </div>
                    <input type="file" id="videoInput" accept="video/*" onchange="handleVideoUpload(event)">

                    <div id="loading" class="loading">
                        <div class="spinner"></div>
                        <p>正在分析视频...</p>
                        <p style="color: #999; font-size: 0.9em;">这可能需要 1-3 分钟</p>
                    </div>
                </div>

                <!-- 结果标签页 -->
                <div id="result" class="tab-content">
                    <div id="resultContent"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        function handleVideoUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const apiKey = document.getElementById('apiKey').value;
            const baseUrl = document.getElementById('baseUrl').value;

            if (!apiKey) {
                alert('请先输入 API Key');
                return;
            }

            document.getElementById('loading').style.display = 'block';
            document.getElementById('resultContent').innerHTML = '';

            const formData = new FormData();
            formData.append('video', file);
            formData.append('api_key', apiKey);
            formData.append('base_url', baseUrl);

            fetch('/api/analyze', {
                method: 'POST',
                body: formData
            })
            .then(r => r.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';

                if (data.error) {
                    document.getElementById('resultContent').innerHTML = `<div class="error">❌ ${data.error}</div>`;
                    return;
                }

                displayResult(data);
                loadHistory();
            })
            .catch(err => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('resultContent').innerHTML = `<div class="error">❌ 错误: ${err}</div>`;
            });
        }

        function displayResult(data) {
            const analysis = data.analysis;
            const summary = analysis.video_summary;
            const music = analysis.music_recommendation;
            const timeline = analysis.timeline;

            let html = `
                <div class="result-section">
                    <h3>📺 视频摘要</h3>
                    <div class="result-card">
                        <p><strong>标题:</strong> ${summary.title}</p>
                        <p><strong>主题:</strong> ${summary.main_theme}</p>
                        <p><strong>情感:</strong> ${summary.overall_emotion}</p>
                        <p><strong>时长:</strong> ${summary.duration}秒</p>
                    </div>
                </div>

                <div class="result-section">
                    <h3>🎵 音乐推荐</h3>
                    <div class="result-card">
                        <p><strong>风格:</strong> ${music.style}</p>
                        <p><strong>节奏:</strong> ${music.tempo}</p>
                        <p><strong>乐器:</strong> ${music.instrumentation}</p>
                        <p><strong>强度:</strong> ${music.intensity}/10</p>
                        <p><strong>情绪:</strong> ${music.mood_descriptors.join('、')}</p>
                    </div>
                </div>

                <div class="result-section">
                    <h3>🎼 AI 音乐生成提示词</h3>
                    <div class="result-card">
                        <textarea readonly style="height: 150px;">${data.music_prompt}</textarea>
                        <button class="button" style="margin-top: 10px;" onclick="copyText('${data.music_prompt}')">📋 复制提示词</button>
                    </div>
                </div>

                <div class="result-section">
                    <h3>⏱️ 时间轴分析</h3>
            `;

            timeline.forEach((segment, idx) => {
                html += `
                    <div class="result-card">
                        <p><strong>[${segment.timestamp.toFixed(1)}s] ${segment.visual_description}</strong></p>
                        <p>持续: ~${segment.duration_estimate}s | 情绪: ${segment.emotion}</p>
                        <p>音效: ${segment.sfx_needs.join('、')}</p>
                `;
                if (segment.sfx_prompts) {
                    html += '<p><strong>音效提示词:</strong></p>';
                    for (let sfx in segment.sfx_prompts) {
                        html += `<p><code>${sfx}</code>: ${segment.sfx_prompts[sfx]}</p>`;
                    }
                }
                html += `</div>`;
            });

            html += `</div>`;

            document.getElementById('resultContent').innerHTML = html;
            document.querySelector('[onclick="switchTab(\'result\')"]').click();
        }

        function copyText(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('✅ 已复制到剪贴板');
            });
        }

        function loadHistory() {
            fetch('/api/history')
            .then(r => r.json())
            .then(data => {
                const historyList = document.getElementById('historyList');
                if (!data.history || data.history.length === 0) {
                    historyList.innerHTML = '<p style="color: #999; font-size: 0.9em;">暂无分析历史</p>';
                    return;
                }

                historyList.innerHTML = data.history.map((item, idx) => `
                    <div class="history-item" onclick="viewHistory(${item.id})">
                        <p><strong>${item.video_name}</strong></p>
                        <p style="font-size: 0.85em; color: #999;">${item.upload_time.substring(0, 19)}</p>
                    </div>
                `).join('');
            });
        }

        function viewHistory(id) {
            fetch(`/api/history/${id}`)
            .then(r => r.json())
            .then(data => {
                if (data.item) {
                    displayResult({
                        analysis: data.item.analysis_result,
                        music_prompt: data.item.music_prompt,
                        sfx_prompts: data.item.sfx_prompts
                    });
                }
            });
        }

        // 初始化
        loadHistory();
        setInterval(loadHistory, 5000);
    </script>
</body>
</html>
